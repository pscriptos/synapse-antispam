name: Build & Push Synapse Antispam Image

on:
  schedule:
    - cron: '0 18 * * *'  # täglich um 18:00 Uhr
  workflow_dispatch:      # manueller Trigger über die Gitea UI
    inputs:
      synapse_version:
        description: 'Synapse-Version (z. B. v1.164.1) – leer = neueste stabile Version'
        required: false
        default: ''
      force:
        description: 'Image neu bauen, auch wenn der Tag bereits existiert'
        type: boolean
        required: false
        default: false

env:
  IMAGE_NAME: synapse
  # Zielplattformen – die Images werden immer als Multi-Arch-Manifest gebaut,
  # unabhängig davon, auf welcher Architektur der Runner läuft.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Synapse-Tag ermitteln: manuell vorgegeben oder neuester stabiler
      #    Tag von Docker Hub (keine RC-Tags)
      # -----------------------------------------------------------------------
      - name: Synapse-Tag ermitteln
        id: synapse
        env:
          INPUT_VERSION: ${{ inputs.synapse_version }}
        run: |
          LATEST_TAG=$(curl -sf \
            "https://hub.docker.com/v2/repositories/matrixdotorg/synapse/tags?page_size=100" \
            | jq -r '.results[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Kein gültiger Synapse-Release-Tag gefunden!"
            exit 1
          fi

          TAG="${INPUT_VERSION:-$LATEST_TAG}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ungültige Synapse-Version '${TAG}' (erwartet z. B. v1.164.1)"
            exit 1
          fi

          # 'latest-antispam' nur setzen, wenn die neueste Version gebaut wird
          if [ "$TAG" = "$LATEST_TAG" ]; then IS_LATEST=true; else IS_LATEST=false; fi

          echo "tag=$TAG"                         >> "$GITHUB_OUTPUT"
          echo "versioned_tag=${TAG}-antispam"    >> "$GITHUB_OUTPUT"
          echo "is_latest=$IS_LATEST"             >> "$GITHUB_OUTPUT"
          echo "Zu bauender Tag: $TAG (neueste stabile Version: $LATEST_TAG)"

      # -----------------------------------------------------------------------
      # 2. Prüfen ob der versionierte Tag schon in der Registry existiert.
      #    Ein vorhandener Tag, der kein Multi-Arch-Manifest ist (z. B. alte
      #    Single-Arch-Builds), wird ebenfalls neu gebaut – der Tag bleibt
      #    dabei erhalten und zeigt danach auf das Multi-Arch-Manifest.
      # -----------------------------------------------------------------------
      - name: Prüfen ob Image bereits in Registry vorhanden
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          VERSIONED_TAG="${{ steps.synapse.outputs.versioned_tag }}"

          if [ "$FORCE" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Force-Build angefordert – Tag '${VERSIONED_TAG}' wird neu gebaut."
            exit 0
          fi

          MEDIA_TYPE=$(curl -s \
            -u "${{ secrets.REGISTRY_USER }}:${{ secrets.TOKEN }}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            -o /dev/null -w "%{http_code} %{content_type}" \
            "https://${{ vars.REGISTRY_HOST }}/v2/${{ gitea.repository_owner }}/${{ env.IMAGE_NAME }}/manifests/${VERSIONED_TAG}")

          case "$MEDIA_TYPE" in
            "200 "*image.index*|"200 "*manifest.list*)
              echo "exists=true"  >> "$GITHUB_OUTPUT"
              echo "Tag '${VERSIONED_TAG}' bereits als Multi-Arch-Image vorhanden – kein Build nötig."
              ;;
            "200 "*)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "Tag '${VERSIONED_TAG}' ist nur ein Single-Arch-Image – wird als Multi-Arch neu gebaut."
              ;;
            *)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "Tag '${VERSIONED_TAG}' nicht gefunden (${MEDIA_TYPE}) – Build wird gestartet."
              ;;
          esac

      # -----------------------------------------------------------------------
      # 3. QEMU & Buildx für Multi-Arch-Builds einrichten
      # -----------------------------------------------------------------------
      - name: QEMU einrichten
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 4. Registry Login
      # -----------------------------------------------------------------------
      - name: Registry Login
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "${{ secrets.TOKEN }}" \
            | docker login "${{ vars.REGISTRY_HOST }}" \
                -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # -----------------------------------------------------------------------
      # 5. Multi-Arch-Image bauen und versionierten Tag pushen
      #    (SYNAPSE_VERSION als Build-Arg übergeben)
      # -----------------------------------------------------------------------
      - name: Multi-Arch-Image bauen & pushen
        if: steps.check.outputs.exists == 'false'
        run: |
          REGISTRY="${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ env.IMAGE_NAME }}"
          SYNAPSE_TAG="${{ steps.synapse.outputs.tag }}"
          VERSIONED_TAG="${{ steps.synapse.outputs.versioned_tag }}"

          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            --pull \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg SYNAPSE_VERSION="${SYNAPSE_TAG}" \
            -t "${REGISTRY}:${VERSIONED_TAG}" \
            --push \
            .

      # -----------------------------------------------------------------------
      # 6. Alten 'latest-antispam' Tag in Gitea löschen, damit Gitea das Datum
      #    korrekt aktualisiert, und direkt danach neu auf das frisch gebaute
      #    Multi-Arch-Manifest setzen (nur Manifest-Kopie, dauert Sekunden)
      # -----------------------------------------------------------------------
      - name: Tag latest-antispam aktualisieren
        if: steps.check.outputs.exists == 'false' && steps.synapse.outputs.is_latest == 'true'
        run: |
          REGISTRY="${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ env.IMAGE_NAME }}"
          VERSIONED_TAG="${{ steps.synapse.outputs.versioned_tag }}"

          curl -s -X DELETE \
            "${{ gitea.server_url }}/api/v1/packages/${{ gitea.repository_owner }}/container/${{ env.IMAGE_NAME }}/latest-antispam" \
            -H "Authorization: token ${{ secrets.TOKEN }}" || true

          docker buildx imagetools create \
            -t "${REGISTRY}:latest-antispam" \
            "${REGISTRY}:${VERSIONED_TAG}"

      # -----------------------------------------------------------------------
      # 7. Prüfen, ob alle Plattformen im Manifest enthalten sind
      # -----------------------------------------------------------------------
      - name: Multi-Arch-Manifest prüfen
        if: steps.check.outputs.exists == 'false'
        run: |
          REGISTRY="${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ env.IMAGE_NAME }}"
          TAGS="${{ steps.synapse.outputs.versioned_tag }}"
          [ "${{ steps.synapse.outputs.is_latest }}" = "true" ] && TAGS="$TAGS latest-antispam"

          for T in $TAGS; do
            INSPECT=$(docker buildx imagetools inspect "${REGISTRY}:${T}")
            echo "$INSPECT"
            for P in $(echo "${{ env.PLATFORMS }}" | tr ',' ' '); do
              if ! echo "$INSPECT" | grep -q "Platform:.*${P}"; then
                echo "::error::Plattform ${P} fehlt im Manifest von ${T}!"
                exit 1
              fi
            done
            echo "✓ ${T}: alle Plattformen vorhanden (${{ env.PLATFORMS }})"
          done

      # -----------------------------------------------------------------------
      # 8. Ntfy Erfolgs-Benachrichtigung
      #    Secrets werden als Umgebungsvariablen übergeben, damit sie nicht
      #    direkt in Shell-Kommandos interpoliert werden.
      # -----------------------------------------------------------------------
      - name: Ntfy Benachrichtigung senden
        if: steps.check.outputs.exists == 'false'
        env:
          NTFY_PUBLIC:  ${{ secrets.NTFY_TOPIC_PUBLIC }}
          NTFY_SECURED: ${{ secrets.NTFY_TOPIC_SECURED }}
          NTFY_TOKEN:   ${{ secrets.NTFY_AUTH_TOKEN }}
        run: |
          VERSIONED_TAG="${{ steps.synapse.outputs.versioned_tag }}"
          REGISTRY_HOST="${{ vars.REGISTRY_HOST }}"
          OWNER="${{ gitea.repository_owner }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          SERVER_URL="${{ gitea.server_url }}"
          REPO="${{ gitea.repository }}"
          TITLE="✅ Synapse aktualisiert"
          MESSAGE="gitea_actions: Neues Docker-Image '${VERSIONED_TAG}' erfolgreich gebaut und in die Registry https://${REGISTRY_HOST}/${OWNER}/-/packages/container/${IMAGE} gepusht. -- Weitere Infos hier: ${SERVER_URL}/${REPO}"

          # Öffentlicher Topic – optional mit Auth (falls ntfy Auth erfordert)
          if [ -n "$NTFY_PUBLIC" ]; then
            AUTH_HEADER=""
            if [ -n "$NTFY_TOKEN" ]; then
              AUTH_HEADER="-H \"Authorization: Bearer ${NTFY_TOKEN}\""
            fi
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$NTFY_PUBLIC" \
              ${AUTH_HEADER:+-H "Authorization: Bearer ${NTFY_TOKEN}"} \
              -H "Title: ${TITLE}" \
              -H "Priority: 4" \
              -d "$MESSAGE")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Ntfy (public) zugestellt"
            else
              echo "⚠️ Ntfy (public) Zustellung fehlgeschlagen (HTTP ${HTTP_CODE})"
            fi
          fi

          # Gesicherter Topic (mit Bearer-Token) – optional
          if [ -n "$NTFY_SECURED" ]; then
            curl -sf -X POST "$NTFY_SECURED" \
              -H "Authorization: Bearer ${NTFY_TOKEN}" \
              -H "Title: ${TITLE}" \
              -H "Priority: 4" \
              -d "$MESSAGE" \
            || echo "⚠️ Ntfy (secured) Zustellung fehlgeschlagen"
          fi
